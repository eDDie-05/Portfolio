<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Illustration of a terminal window building a C program with no warnings and showing a student management menu"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0C1A34"/><stop offset="1" stop-color="#050A14"/></linearGradient><radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#22D3EE" stop-opacity=".30"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient><linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#4F8CFF"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#5B8BD8" stroke-opacity=".11"/></pattern></defs><style>
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.flow{stroke-dasharray:6 8;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.bob{animation:bob 5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.pulse,.flow,.blink,.bob{animation:none}}
</style><rect width="800" height="500" fill="url(#bg)"/><rect width="800" height="500" fill="url(#grid)"/><circle cx="400" cy="250" r="230" fill="url(#glow)"/><rect x="70" y="56" width="660" height="388" rx="16" fill="#07101F" stroke="#2B4A7A" stroke-width="2"/><path d="M70 72 a16 16 0 0 1 16 -16 H714 a16 16 0 0 1 16 16 V96 H70 Z" fill="#0E1A2E"/><circle cx="94" cy="76" r="6" fill="#F87171"/><circle cx="114" cy="76" r="6" fill="#FBBF24"/><circle cx="134" cy="76" r="6" fill="#34D399"/><text x="400" y="81" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#7C90B0">sms: terminal</text><text x="100" y="130" xml:space="preserve" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="19" fill="#93C5FD">$ make</text><text x="100" y="158" xml:space="preserve" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="19" fill="#6B7F9E">gcc -Wall -Wextra -std=c11 -c src/*.c</text><text x="100" y="186" xml:space="preserve" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="19" fill="#86EFAC">Build complete: 0 warnings</text><text x="100" y="224" xml:space="preserve" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="19" fill="#93C5FD">$ ./sms</text><text x="100" y="270" xml:space="preserve" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="19" fill="#22D3EE" font-weight="700">Student Management System</text><text x="100" y="308" xml:space="preserve" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="19" fill="#D5E3F8">  1) Students      2) Courses</text><text x="100" y="336" xml:space="preserve" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="19" fill="#D5E3F8">  3) Enrollments   4) Grades</text><text x="100" y="364" xml:space="preserve" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="19" fill="#D5E3F8">  5) GPA report    0) Exit</text><text x="100" y="410" xml:space="preserve" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="19" fill="#93C5FD">> </text><rect class="blink" x="122" y="394" width="11" height="20" fill="#22D3EE"/></svg>